appId: com.y7sk.app
productName: Y7SK
copyright: Copyright © 2026 Y7SK

directories:
  output: release/${version}
  buildResources: build

asar: true

files:
  - out/**
  - package.json
  - '!**/*.{map,ts,tsx}'
  - '!docs/**'
  - '!src/**'

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: Y7SK

portable:
  artifactName: ${productName}-${version}-portable.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icons
  category: AudioVideo
  synopsis: Modern desktop client for SoundCloud
  description: Lightweight cross-platform desktop client for SoundCloud.
  desktop:
    entry:
      Name: Y7SK
      Comment: Modern desktop client for SoundCloud
      Categories: AudioVideo;Audio;Music;
      StartupWMClass: Y7SK

deb:
  category: AudioVideo
  packageCategory: sound
  priority: optional

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.icns
  category: public.app-category.music

dmg:
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
