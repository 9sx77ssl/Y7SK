<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b21"/>
      <stop offset="1" stop-color="#0d0d10"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a33"/>
      <stop offset="1" stop-color="#ff5500"/>
    </linearGradient>
  </defs>

  <!-- rounded-square tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#tile)"/>

  <!-- minimalist Y7 lockup, centered -->
  <g fill="url(#mark)">
    <!-- Y -->
    <path d="M236 286 L334 286 L424 446 L514 286 L612 286 L470 530 L470 740 L378 740 L378 530 Z"/>
    <!-- 7 -->
    <path d="M560 286 L800 286 L800 366 L688 740 L584 740 L690 366 L560 366 Z"/>
  </g>
</svg>
