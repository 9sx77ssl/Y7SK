<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- dark tile gradient -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a20"/>
      <stop offset="1" stop-color="#0f0f12"/>
    </linearGradient>
    <!-- orange mark gradient -->
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7733"/>
      <stop offset="1" stop-color="#ff5500"/>
    </linearGradient>
    <!-- subtle top sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- soft glow behind the mark -->
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.55">
      <stop offset="0" stop-color="#ff5500" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded-square tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#tile)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#glow)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="226" ry="226" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <rect x="0" y="0" width="1024" height="510" rx="228" ry="228" fill="url(#sheen)"/>

  <g fill="url(#mark)">
    <!-- Y: two arms meeting a stem, left of center -->
    <path d="M236 286
             L334 286
             L424 446
             L514 286
             L612 286
             L470 530
             L470 740
             L378 740
             L378 530
             Z"/>
    <!-- 7: bold top bar + strong slanted diagonal, right of the Y -->
    <path d="M560 286
             L800 286
             L800 366
             L688 740
             L584 740
             L690 366
             L560 366
             Z"/>
  </g>

  <!-- waveform motif: ascending bars under the lockup -->
  <g fill="url(#mark)" opacity="0.9">
    <rect x="312" y="812" width="22" height="52"  rx="11"/>
    <rect x="358" y="790" width="22" height="96"  rx="11"/>
    <rect x="404" y="768" width="22" height="140" rx="11"/>
    <rect x="450" y="752" width="22" height="172" rx="11"/>
    <rect x="496" y="768" width="22" height="140" rx="11"/>
    <rect x="542" y="790" width="22" height="96"  rx="11"/>
    <rect x="588" y="804" width="22" height="68"  rx="11"/>
    <rect x="634" y="814" width="22" height="48"  rx="11"/>
    <rect x="680" y="820" width="22" height="36"  rx="11"/>
  </g>
</svg>
